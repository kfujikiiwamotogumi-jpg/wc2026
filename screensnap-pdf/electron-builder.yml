appId: jp.iwamotogumi.screensnap-pdf
productName: ScreenSnap PDF
directories:
  buildResources: build
  output: release
files:
  - out/**
  - "!**/*.map"
win:
  target:
    - nsis
  icon: build/icon.png
  artifactName: ${productName}-${version}-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: ScreenSnap PDF
